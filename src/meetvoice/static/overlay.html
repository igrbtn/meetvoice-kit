<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live translation</title>
<style>
  :root { --fs: 15px; }
  html, body { margin: 0; height: 100%; background: transparent; color: #f2f2f2;
    font: var(--fs)/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-user-select: text; overflow: hidden; }
  body.browser { background: rgba(28, 28, 32, 0.92); }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px; align-items: center;
    padding: 4px 8px; font-size: 11px; color: #aaa; background: rgba(0,0,0,0.25); }
  #bar button { background: rgba(255,255,255,0.1); color: #ddd; border: 0; border-radius: 4px;
    font-size: 11px; padding: 2px 6px; cursor: pointer; }
  #bar button.on { background: #3b6fd6; color: #fff; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0 !important; }
  .seg button:first-child { border-radius: 4px 0 0 4px !important; }
  .seg button:last-child { border-radius: 0 4px 4px 0 !important; }
  #bar .sp { flex: 1; }
  #log { position: absolute; top: 26px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 6px 10px 10px; }
  .row { margin: 0 0 8px; }
  .who { font-size: 11px; color: #8fb3ff; margin-right: 6px; }
  .row.me .who { color: #9a9a9a; }
  .row.me .text { color: #bdbdbd; }
  .tr { font-size: 1.05em; font-weight: 500; color: #fff; }
  .row.foreign .text { font-size: 0.8em; color: #9a9a9a; font-style: italic; display: block; }
  .row.wait .tr::after { content: "перевожу..."; color: #777; font-weight: 400; font-size: 0.85em; }
  /* "перевод": the whole talk in one language - originals only where nothing is translated yet */
  body.mode-tr .row.foreign:not(.wait) .text { display: none; }
  body.mode-tr .row.foreign .text { font-size: 1em; }
  body.mode-tr .row:not(.foreign) .tr { display: none; }
  /* "оригинал": plain transcript */
  body.mode-orig .tr { display: none; }
  body.mode-orig .row.foreign .text { font-size: 1em; font-style: normal; color: inherit; display: inline; }
  .row.filler { opacity: 0.45; font-size: 0.85em; }
  .row.unsure .text { opacity: 0.55; }
  .row.unsure .text::after { content: " ?"; color: #e0b038; font-weight: 600; }
  #drafts .row, #drafts .row .text { color: #8a8a8a; font-style: italic; }
  #idle { color: #aaa; padding: 30px 12px; text-align: center; }
  #idle button { margin-top: 10px; background: #c62828; color: #fff; border: 0; border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #err { color: #e57373; font-size: 11px; }
</style>
</head>
<body>
<div id="bar">
  <span id="state">...</span><span id="err"></span><span class="sp"></span>
  <span class="seg"><button data-mode="both" title="Оригинал и перевод">оба</button><button data-mode="tr"
    title="Весь разговор на одном языке">перевод</button><button data-mode="orig"
    title="Только транскрипт">оригинал</button></span>
  <button id="smaller" title="Мельче">A-</button><button id="bigger" title="Крупнее">A+</button>
</div>
<div id="log"><div id="rows"></div><div id="drafts"></div></div>
<div id="idle" style="display:none;">Нет активной сессии.</div>
<script>
const inApp = !!(window.webkit && window.webkit.messageHandlers) || navigator.userAgent.indexOf('Safari') < 0;
if (!inApp) document.body.classList.add('browser');
const MAX_ROWS = 80;
const log = document.getElementById('log');
const box = document.getElementById('rows');
const draftBox = document.getElementById('drafts');
const rows = new Map();
let next = 0, session = null, mode = 'both', fs = 15;
function load(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
mode = load('ov-mode', 'both'); fs = load('ov-fs', 15);
function applyPrefs() {
  document.documentElement.style.setProperty('--fs', fs + 'px');
  document.body.classList.remove('mode-both', 'mode-tr', 'mode-orig');
  document.body.classList.add('mode-' + mode);
  for (const b of document.querySelectorAll('.seg button')) b.classList.toggle('on', b.dataset.mode === mode);
}
function render(e, wantTr) {
  let r = rows.get(e.i);
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  if (!r) {
    r = document.createElement('div');
    const foreign = !!e.lang && e.lang !== 'ru' && !!e.target;
    const unsure = !!(e.unsure && e.unsure.length);
    r.className = 'row' + (e.speaker === 'Я' ? ' me' : '') + (foreign ? ' foreign' : '')
      + (e.filler ? ' filler' : '') + (unsure ? ' unsure' : '');
    if (unsure) r.title = 'Не уверен: ' + e.unsure.join(', ') + ' - не переводится';
    const who = document.createElement('span'); who.className = 'who'; who.textContent = e.speaker;
    r._text = document.createElement('span'); r._text.className = 'text'; r._text.textContent = e.text;
    r._tr = document.createElement('div'); r._tr.className = 'tr';
    r.append(who);
    if (foreign) r.append(r._tr, r._text); else r.append(r._text, r._tr);
    rows.set(e.i, r); box.append(r);
    while (rows.size > MAX_ROWS) { const k = rows.keys().next().value; rows.get(k).remove(); rows.delete(k); }
  }
  r._tr.textContent = e.translation || '';
  r.classList.toggle('wait', wantTr && !e.translation);
  if (atBottom) log.scrollTop = log.scrollHeight;
}
// open utterances: gray, replaced wholesale every second until their final lines land
function renderDrafts(drafts) {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  draftBox.textContent = '';
  for (const d of drafts || []) {
    const r = document.createElement('div');
    r.className = 'row' + (d.speaker === 'Я' ? ' me' : '');
    const who = document.createElement('span'); who.className = 'who'; who.textContent = d.speaker;
    const t = document.createElement('span'); t.className = 'text'; t.textContent = d.text;
    r.append(who, t); draftBox.append(r);
  }
  if (atBottom) log.scrollTop = log.scrollHeight;
}
async function poll() {
  let d;
  try { d = await (await fetch('live?after=' + next)).json(); } catch (e) { return; }
  document.getElementById('idle').style.display = d.active ? 'none' : '';
  log.style.display = d.active ? '' : 'none';
  document.getElementById('state').textContent = d.active ? '● live' : 'остановлено';
  document.getElementById('err').textContent = d.error || '';
  if (!d.active) return;
  if (d.session_id !== session) { session = d.session_id; next = 0; rows.clear(); box.textContent = ''; return poll(); }
  for (const e of d.entries) {
    const wantTr = !!e.target;
    render(e, wantTr);
    // keep re-polling a line until its translation lands
    if (e.translation || !wantTr) { if (e.i === next) next = e.i + 1; }
  }
  renderDrafts(d.drafts);
}
for (const b of document.querySelectorAll('.seg button'))
  b.onclick = () => { mode = b.dataset.mode; save('ov-mode', mode); applyPrefs(); };
document.getElementById('smaller').onclick = () => { fs = Math.max(11, fs - 1); save('ov-fs', fs); applyPrefs(); };
document.getElementById('bigger').onclick = () => { fs = Math.min(26, fs + 1); save('ov-fs', fs); applyPrefs(); };

applyPrefs();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
